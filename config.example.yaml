# Copy to config.yaml and fill in your thermostat MAC addresses.
# Find MACs with the built-in scanner (no phone app needed):
#   gira-ble-api scan
# Stand near the device; press pairing briefly if it is quiet.

host: 127.0.0.1
port: 8787

# Seconds since last advertisement before a thermostat is considered offline.
online_timeout_s: 120

# BLE connect / write timeout for setpoint commands (macOS: allow time for Pair popup).
ble_timeout_s: 30

# Keep GATT open briefly for rapid successive commands, then disconnect.
idle_disconnect_s: 5

thermostats:
  - id: living
    name: Wohnzimmer
    mac: "AA:BB:CC:DD:EE:FF"
  # - id: bedroom
  #   name: Schlafzimmer
  #   mac: "11:22:33:44:55:66"
