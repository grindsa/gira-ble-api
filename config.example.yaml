# Copy to config.yaml and fill in your device MAC addresses.
# Find MACs with the built-in scanner (no phone app needed):
#   gira-ble-api scan
# Stand near the device; press pairing briefly if it is quiet.

host: 127.0.0.1
port: 8787

# Optional API tokens (Bearer). Omit or leave empty for open access.
# Single line (comma-separated) or a YAML list — both work.
#   api_tokens: "dashboard-secret, laptop-curl"
#   api_tokens:
#     - dashboard-secret
#     - laptop-curl
# Clients send:  Authorization: Bearer dashboard-secret
# /health stays unauthenticated. Keep this file mode 600 on the Pi.
api_tokens: ""

# Seconds since last advertisement before a device is considered offline.
online_timeout_s: 120

# BLE connect / write timeout for commands (macOS: allow time for Pair popup).
ble_timeout_s: 30

# Keep GATT open briefly for rapid successive commands, then disconnect.
idle_disconnect_s: 5

# Background GATT poll for heating_active. 0 / omit = no poll (default).
# On the Pi, set e.g. 900 to refresh every 15 minutes. On-demand still works:
#   GET /thermostats/{id}?refresh=1
heating_poll_s: 0
# Seconds to wait for heating status notify after connect / setpoint write.
heating_listen_s: 20
# After each device poll, leave the scanner running this long so other devices
# can refresh ads / online state before the next GATT pause.
heating_poll_gap_s: 30

thermostats:
  - id: living
    name: Wohnzimmer
    mac: "AA:BB:CC:DD:EE:FF"
  # - id: bedroom
  #   name: Schlafzimmer
  #   mac: "11:22:33:44:55:66"

# System 3000 BT covers (blinds / shutters / timers, e.g. 536727).
# Position is percent open (0=closed, 100=open).
# Ids and MACs must not collide with thermostats.
covers:
