[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gira-ble-api"
version = "0.1.0"
description = "Standalone REST API for Gira System 3000 Bluetooth thermostats"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "gira-ble-api contributors" }]
dependencies = [
    "bleak>=0.22",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
gira-ble-api = "gira_ble_api.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gira_ble_api = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
